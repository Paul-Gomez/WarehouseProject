server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # La API va al contenedor del backend: para el navegador es el mismo origen.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los ficheros de /assets llevan un hash en el nombre: se pueden cachear sin límite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Cualquier otra ruta la resuelve React Router en el navegador.
  location / {
    try_files $uri /index.html;
  }
}
