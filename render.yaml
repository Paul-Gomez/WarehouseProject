# Blueprint de Render: API (contenedor Docker) + base de datos PostgreSQL.
# En Render: New > Blueprint > elegir este repositorio.
services:
  - type: web
    name: warehouseproject-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warehouseproject-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: '1'
      # La URL del frontend en Vercel (p. ej. https://warehouseproject.vercel.app).
      # Se rellena a mano en el panel de Render tras desplegar el frontend.
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: warehouseproject-db
    plan: free
    databaseName: warehouseproject
    user: warehouseproject
